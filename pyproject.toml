[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-computer-controller"
version = "0.1.0"
description = "A small, local-first Windows desktop control API for Arena and other agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ArenaComputerController contributors" }]
dependencies = []

[project.optional-dependencies]
windows = [
  "pywinauto>=0.6.8",
  "mss>=9.0",
  "Pillow>=10.0",
  "psutil>=5.9",
  "pyautogui>=0.9.54",
]
benchmark = ["Pillow>=10.0", "mss>=9.0"]
mcp = ["mcp>=2.3.0,<3; python_version >= '3.11'"]

[project.scripts]
arena-computer-controller = "arena_computer_controller.__main__:main"
arena-computer-controller-mcp = "arena_computer_controller.mcp_server:main"
arena-computer-agent = "arena_computer_controller.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
